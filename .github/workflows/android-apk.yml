name: Android APK

# The APK cannot be built in a sandbox that blocks Google's Maven repository,
# so the build lives here where the Android SDK and androidx artifacts are
# reachable. Every run uploads the APK as a downloadable artifact.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName, e.g. 1.0.1'
        required: false
        default: '1.0.0'
      version_code:
        description: 'versionCode — must increase for every Play Store upload'
        required: false
        default: '1'
  # Not limited to main: an Android change should be proven to still produce an
  # installable APK on the branch, before it is merged.
  #
  # No `paths` filter here on purpose. GitHub requires every push filter to match,
  # so combining `paths` with `tags` would skip a release tag whenever the tagged
  # commit happened not to touch android/ — exactly the commit that must build.
  # The job takes about a minute, so building on every push is the cheaper trade.
  push:
    branches:
      - '**'
    # A v* tag publishes the release APK so /download can link to it.
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed only by the release step; every other step is read-only.
    permissions:
      contents: write

    env:
      # Resolved at job level because the secrets context is not reliably
      # available in a step-level `if`.
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code || '1' }}
      BUILD_TOOLS_VERSION: '35.0.0'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image ships an Android SDK but the exact platform and
      # build-tools versions drift between images, so pin what the build needs.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' "build-tools;$BUILD_TOOLS_VERSION" 'platform-tools'

      # Only runs when the repository has release signing secrets set. Without
      # them the job still produces a debug APK, which is installable by
      # sideloading but cannot be uploaded to the Play Store.
      - name: Decode release keystore
        id: keystore
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK
        if: env.HAS_SIGNING == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Both formats: the AAB is what Google Play accepts for a new app, the
        # APK is for distributing the same release outside the store.
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      # Each fingerprint below must appear in
      # https://tailornow.shop/.well-known/assetlinks.json or Android shows a
      # URL bar over the app instead of running it fullscreen.
      - name: Print signing certificate fingerprints
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          {
            echo '## Signing fingerprints'
            echo
            echo 'Each SHA-256 below must be listed in `public/.well-known/assetlinks.json`'
            echo 'for the app to run without a URL bar.'
            echo
            while read -r apk; do
              echo "### $(basename "$apk")"
              echo '```'
              "$APKSIGNER" verify --print-certs "$apk" | grep -i 'SHA-256' || echo '(none reported)'
              echo '```'
            done < <(find android/app/build/outputs/apk -name '*.apk' | sort)
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tailornow-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      # Separate artifact so the Play Store upload is not buried among the APKs.
      - name: Upload release AAB
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tailornow-playstore-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90

      # Publishes the APK under a fixed asset name so
      # /releases/latest/download/tailornow.apk is a permanent link the
      # /download page can point at without being edited each release.
      - name: Publish release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No release APK at $APK — signing secrets may be incomplete."
            exit 1
          fi
          cp "$APK" tailornow.apk
          gh release create "${GITHUB_REF_NAME}" tailornow.apk \
            --title "TailorNow ${GITHUB_REF_NAME}" \
            --notes "Android app for tailornow.shop. Install instructions: https://tailornow.shop/download" \
            || gh release upload "${GITHUB_REF_NAME}" tailornow.apk --clobber

      - name: Warn when a tag cannot be released
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNING != 'true'
        run: |
          echo "::warning::Tag ${GITHUB_REF_NAME} built, but no release was published \
          because signing secrets are not configured. A debug APK cannot be shipped to users."
