name: Android APK

# The APK cannot be built in a sandbox that blocks Google's Maven repository,
# so the build lives here where the Android SDK and androidx artifacts are
# reachable. Every run uploads the APK as a downloadable artifact.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName, e.g. 1.0.1'
        required: false
        default: '1.0.0'
      version_code:
        description: 'versionCode — must increase for every Play Store upload'
        required: false
        default: '1'
  # Deliberately not limited to main: an Android change should be proven to
  # still produce an installable APK on the branch, before it is merged.
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Resolved at job level because the secrets context is not reliably
      # available in a step-level `if`.
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code || '1' }}
      BUILD_TOOLS_VERSION: '35.0.0'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image ships an Android SDK but the exact platform and
      # build-tools versions drift between images, so pin what the build needs.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' "build-tools;$BUILD_TOOLS_VERSION" 'platform-tools'

      # Only runs when the repository has release signing secrets set. Without
      # them the job still produces a debug APK, which is installable by
      # sideloading but cannot be uploaded to the Play Store.
      - name: Decode release keystore
        id: keystore
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK
        if: env.HAS_SIGNING == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      # Each fingerprint below must appear in
      # https://tailornow.shop/.well-known/assetlinks.json or Android shows a
      # URL bar over the app instead of running it fullscreen.
      - name: Print signing certificate fingerprints
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          {
            echo '## Signing fingerprints'
            echo
            echo 'Each SHA-256 below must be listed in `public/.well-known/assetlinks.json`'
            echo 'for the app to run without a URL bar.'
            echo
            while read -r apk; do
              echo "### $(basename "$apk")"
              echo '```'
              "$APKSIGNER" verify --print-certs "$apk" | grep -i 'SHA-256' || echo '(none reported)'
              echo '```'
            done < <(find android/app/build/outputs/apk -name '*.apk' | sort)
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tailornow-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
